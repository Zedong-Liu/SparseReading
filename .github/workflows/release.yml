name: Release registries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Report release toolchain
        run: |
          python --version
          uv --version
          node --version
          npm --version
      - name: Check release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release.py
          fi
      - name: Build and inspect all registry artifacts
        run: python scripts/build_release.py --output dist/release
      - name: Check Python package descriptions
        run: uvx twine check dist/release/python/*
      - name: Smoke-test a clean wheel installation
        shell: bash
        run: |
          uv venv .release-venv --python 3.12
          uv pip install --python .release-venv/bin/python dist/release/python/*.whl
          core_wheel=$(find dist/release/python -maxdepth 1 -name 'sparseread-*.whl' -print -quit)
          uv pip install --python .release-venv/bin/python "${core_wheel}[all]"
          .release-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points, version

          import sparseread
          import sparseread_claude
          import sparseread_nanobot
          import sparseread_opencode
          import sparseread_openclaw
          import openpyxl
          import pymupdf

          expected = sparseread.__version__
          distributions = (
              "sparseread",
              "sparseread-nanobot",
              "sparseread-opencode",
              "sparseread-openclaw",
              "sparseread-claude",
          )
          assert all(version(name) == expected for name in distributions)
          scripts = {entry.name for entry in entry_points(group="console_scripts")}
          assert {
              "sparseread-opencode-bridge",
              "sparseread-openclaw-bridge",
              "sparseread-claude-bridge",
              "sparseread-claude-mcp",
              "sparseread-claude-hook",
          } <= scripts
          PY
          .release-venv/bin/sparseread-opencode-bridge --help >/dev/null
          .release-venv/bin/sparseread-openclaw-bridge --help >/dev/null
          .release-venv/bin/sparseread-claude-bridge --help >/dev/null
          .release-venv/bin/sparseread-claude-mcp --help >/dev/null
          .release-venv/bin/sparseread-claude-hook --help >/dev/null
      - name: Smoke-test clean npm installations
        shell: bash
        run: |
          npm_test_dir=$(mktemp -d)
          npm install --prefix "$npm_test_dir" --ignore-scripts \
            openclaw@2026.7.1 \
            "$GITHUB_WORKSPACE"/dist/release/npm/*.tgz
          cd "$npm_test_dir"
          node --input-type=module -e "await import('@sparseread/opencode')"
          node --input-type=module -e "await import('@sparseread/openclaw')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-artifacts
          path: dist/release
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish Python packages to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sparseread/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-artifacts
          path: dist/release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/release/python
          skip-existing: true
          attestations: true

  publish-npm:
    name: Publish ${{ matrix.package }} to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@sparseread/opencode"
            tarball: sparseread-opencode
          - package: "@sparseread/openclaw"
            tarball: sparseread-openclaw
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ matrix.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: registry-artifacts
          path: dist/release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Publish or confirm existing immutable version
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ matrix.package }}
          TARBALL_STEM: ${{ matrix.tarball }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "$PACKAGE_NAME@$version" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$version already exists; leaving the immutable version unchanged."
            exit 0
          fi
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          fi
          npm publish "dist/release/npm/$TARBALL_STEM-$version.tgz" \
            --access public \
            --provenance
