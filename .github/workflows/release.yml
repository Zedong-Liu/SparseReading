name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Build Python distributions
        run: |
          mkdir -p dist
          uv build --project packages/sparseread-core --out-dir dist
          for adapter in nanobot opencode openclaw claude; do
            uv build --project "integrations/$adapter/python" --out-dir dist
          done
      - name: Build JavaScript plugin packages
        run: |
          npm ci
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
        working-directory: integrations/opencode/plugin
      - name: Pack OpenClaw plugin
        run: |
          npm ci
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
        working-directory: integrations/openclaw/plugin
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
