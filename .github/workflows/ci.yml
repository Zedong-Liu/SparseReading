name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: SparseRead tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SparseRead suite (documented command)
        run: >-
          uv run --project nanobot-sro-v3 --extra dev --with pytest --with pytest-asyncio
          pytest nanobot-sro-v3/tests/sparse_reading -q

  build:
    name: Build plugins and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build OpenCode plugin
        working-directory: integrations/opencode/plugin
        run: |
          npm ci
          npm run build
      - name: Build OpenClaw plugin
        working-directory: integrations/openclaw/plugin
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Build Python packages
        run: |
          mkdir -p dist
          uv build --project packages/sparseread-core --out-dir dist
          for adapter in nanobot opencode openclaw claude; do
            uv build --project "integrations/$adapter/python" --out-dir dist
          done
          ls -la dist
