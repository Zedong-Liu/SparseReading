name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: SparseRead tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests independently
        run: >-
          uv run --project packages/sparseread-core --with pytest --with pytest-asyncio
          pytest packages/sparseread-core/tests -q
      - name: Install test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            "pyyaml>=6.0,<7.0" \
            "mcp>=1.26,<2.0" \
            "pymupdf>=1.25.0" \
            "openpyxl>=3.1.0,<4.0.0" \
            "pytest>=9.0,<10.0" \
            "pytest-asyncio"
      - name: Run full SparseRead suite
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src:${{ github.workspace }}/integrations/nanobot/python/src:${{ github.workspace }}/integrations/opencode/python/src:${{ github.workspace }}/integrations/openclaw/python/src:${{ github.workspace }}/integrations/claude/python/src
        run: .venv/bin/python -m pytest -q

  build:
    name: Build plugins and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build OpenCode plugin
        working-directory: integrations/opencode/plugin
        run: |
          npm ci
          npm run build
      - name: Build OpenClaw plugin
        working-directory: integrations/openclaw/plugin
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v5
      - name: Build Python packages
        run: |
          mkdir -p dist
          uv build --project packages/sparseread-core --out-dir dist
          for adapter in nanobot opencode openclaw claude; do
            uv build --project "integrations/$adapter/python" --out-dir dist
          done
          ls -la dist

  windows-install-tests:
    name: Windows install tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe `
            "pyyaml>=6.0,<7.0" `
            "pytest>=9.0,<10.0" `
            "pytest-asyncio"
      - name: Run installer tests (Windows command semantics)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src;${{ github.workspace }}/integrations/nanobot/python/src;${{ github.workspace }}/integrations/opencode/python/src;${{ github.workspace }}/integrations/openclaw/python/src;${{ github.workspace }}/integrations/claude/python/src
        run: .venv\Scripts\python.exe -m pytest tests\test_install_sparseread.py tests\test_nanobot_driver.py -q
