name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: SparseRead tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run core tests independently
        run: >-
          uv run --project packages/sparseread-core --with pytest --with pytest-asyncio
          pytest packages/sparseread-core/tests -q
      - name: Run full SparseRead suite
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src:${{ github.workspace }}/integrations/nanobot/python/src:${{ github.workspace }}/integrations/opencode/python/src:${{ github.workspace }}/integrations/openclaw/python/src:${{ github.workspace }}/integrations/claude/python/src
        run: uv run --project . --extra test pytest -q

  build:
    name: Build plugins and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build OpenCode plugin
        working-directory: integrations/opencode/plugin
        run: |
          npm ci
          npm run build
      - name: Build OpenClaw plugin
        working-directory: integrations/openclaw/plugin
        run: |
          npm ci
          npm run build
      - name: Validate Pi extension
        working-directory: integrations/pi/package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm pack --dry-run
      - uses: astral-sh/setup-uv@v5
      - name: Build Python packages
        run: |
          mkdir -p dist
          uv build --project packages/sparseread-core --out-dir dist
          for adapter in nanobot opencode openclaw claude; do
            uv build --project "integrations/$adapter/python" --out-dir dist
          done
          uv build --project integrations/agent-tools/python --out-dir dist
          ls -la dist
      - name: Test installed Pi wheel runtime
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/sparseread-pi-ci-home
        run: |
          pi_smoke_root="$(mktemp -d)"
          uv run --python 3.12 python scripts/install_sparseread.py \
            --platform pi --workspace "$pi_smoke_root" \
            --pi-cmd "$GITHUB_WORKSPACE/integrations/pi/package/node_modules/.bin/pi" \
            --reader-extras none --doctor
          SPARSEREAD_PI_RUNTIME_FILE="$pi_smoke_root/.sparseread/pi/sparseread-pi/.sparseread-runtime.json" \
            npm --prefix integrations/pi/package test

  windows-install-tests:
    name: Windows install tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Run installer tests (Windows command semantics)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src;${{ github.workspace }}/integrations/nanobot/python/src;${{ github.workspace }}/integrations/opencode/python/src;${{ github.workspace }}/integrations/openclaw/python/src;${{ github.workspace }}/integrations/claude/python/src
        run: uv run --project . --extra test pytest tests\test_install_sparseread.py tests\test_host_install.py tests\test_nanobot_driver.py -q
