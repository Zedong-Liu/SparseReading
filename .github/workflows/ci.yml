name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: SparseRead tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run core tests independently
        run: >-
          uv run --project packages/sparseread-core --with pytest --with pytest-asyncio
          pytest packages/sparseread-core/tests -q
      - name: Install test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            "pyyaml>=6.0,<7.0" \
            "mcp>=1.26,<2.0" \
            "pymupdf>=1.25.0" \
            "openpyxl>=3.1.0,<4.0.0" \
            "pytest>=9.0,<10.0" \
            "pytest-asyncio"
      - name: Run full SparseRead suite
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src:${{ github.workspace }}/integrations/nanobot/python/src:${{ github.workspace }}/integrations/opencode/python/src:${{ github.workspace }}/integrations/openclaw/python/src:${{ github.workspace }}/integrations/claude/python/src
        run: .venv/bin/python -m pytest -q

  build:
    name: Build plugins and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build and inspect all registry artifacts
        run: python scripts/build_release.py --output dist/release
      - name: Check Python package descriptions
        run: uvx twine check dist/release/python/*

  windows-install-tests:
    name: Windows install tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install test dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv\Scripts\python.exe `
            "pyyaml>=6.0,<7.0" `
            "pytest>=9.0,<10.0" `
            "pytest-asyncio"
      - name: Run installer tests (Windows command semantics)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/sparseread-core/src;${{ github.workspace }}/integrations/nanobot/python/src;${{ github.workspace }}/integrations/opencode/python/src;${{ github.workspace }}/integrations/openclaw/python/src;${{ github.workspace }}/integrations/claude/python/src
        run: .venv\Scripts\python.exe -m pytest tests\test_install_sparseread.py tests\test_nanobot_driver.py -q
