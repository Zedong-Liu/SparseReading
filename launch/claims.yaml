# SparseRead public claim registry
# Paper of record: arXiv:2608.22237v1 (23 Aug 2026)
# Rule: website / GIF / posters / social copy may use only
# approved_for_publication: true items. Do not paraphrase away
# aggregation, baseline, model, or task qualifiers.
#
# approval_policy:
#   true  = stated in the public paper with explicit conditions, or
#           locally cross-checked against a named result file
#   false = superseded local draft, single-run plotting adjustment,
#           figure-OCR uncertain, demo-only, or missing local artifact

paper:
  arxiv_id: "2608.22237"
  version: v1
  title: "Read Less, Solve More: Token-Efficient Sparse Reading for AI Agents"
  url: "https://arxiv.org/pdf/2608.22237"
  github: "https://github.com/Zedong-Liu/SparseReading"
  submitted: "2026-08-23"

setup:
  models:
    - Claude Opus 5
    - Qwen3.6-Plus
    - DeepSeek-V4-Flash
    - DeepSeek-V4-Pro
    - GLM-5.1
    - Kimi-K2.5
  frameworks:
    - {name: NanoBot, version: v0.2.0}
    - {name: OpenCode, version: v1.17.14}
    - {name: OpenClaw, version: v2026.6.11}
  task_sources:
    - QwenClawBench
    - Claw-Eval
    - PinchBench
    - LooGLE
    - materials-chemistry AI-for-Science
  n_tasks_general: 125
  scenarios:
    - long-context reading
    - multi-file audit and diagnosis
    - structured analysis
    - native-fit controls
    - AI for Science (materials chemistry)
  baselines:
    - Naive full reading
    - ACON zero-shot compressor (auxiliary calls included)
    - Complexity Trap observation masking (retain latest 10)
  primary_metrics:
    - total token volume reduction vs Naive
    - task-score change vs Naive
    - end-to-end wall-time saving vs Naive
  gate_analysis_aggregation: "request-count change averaged over three runs (paper §6.1)"

