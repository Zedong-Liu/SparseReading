    model: "six models including Claude Opus 5; maximum cell"
    framework: NanoBot (main matrix, Figure 7)
    dataset: "125-task general eval + AI-for-Science scenario"
    task: "maximum across 30 model–scenario cells"
    num_runs: null
    aggregation: maximum
    source_file: "https://arxiv.org/pdf/2608.22237"
    paper_section: Abstract / §6.2
