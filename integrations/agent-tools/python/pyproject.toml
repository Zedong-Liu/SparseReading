[project]
name = "sparseread-agent-tools"
version = "0.1.2"
description = "Codex and Pi transport adapters for the unchanged SparseRead core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["sparseread-core>=0.1,<0.2", "mcp>=1.26,<2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread_agent_tools"]

[tool.uv.sources]
sparseread-core = { path = "../../../packages/sparseread-core", editable = true }
