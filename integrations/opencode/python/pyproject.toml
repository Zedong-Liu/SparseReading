[project]
name = "sparseread-opencode"
version = "0.1.0"
description = "OpenCode bridge adapter for SparseRead"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["sparseread-core>=0.1,<0.2"]

[project.scripts]
sparseread-opencode-bridge = "sparseread_opencode.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread_opencode"]

[tool.uv.sources]
sparseread-core = { path = "../../../packages/sparseread-core", editable = true }
