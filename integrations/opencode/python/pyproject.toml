[project]
name = "sparseread-opencode"
version = "0.1.1"
description = "OpenCode bridge adapter for SparseRead"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SparseRead contributors" }]
keywords = ["ai-agents", "opencode", "sparse-reading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["sparseread>=0.1.1,<0.2"]

[project.urls]
Homepage = "https://github.com/Zedong-Liu/SparseReading"
Repository = "https://github.com/Zedong-Liu/SparseReading"
Issues = "https://github.com/Zedong-Liu/SparseReading/issues"
Paper = "https://arxiv.org/abs/2608.22237"

[project.scripts]
sparseread-opencode-bridge = "sparseread_opencode.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread_opencode"]

[tool.uv.sources]
sparseread = { path = "../../../packages/sparseread-core", editable = true }
