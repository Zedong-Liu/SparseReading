[project]
name = "sparseread-openclaw"
version = "0.1.0"
description = "OpenClaw bridge adapter for SparseRead"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["sparseread-core>=0.1,<0.2"]

[project.scripts]
sparseread-openclaw-bridge = "sparseread_openclaw.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread_openclaw"]

[tool.uv.sources]
sparseread-core = { path = "../../../packages/sparseread-core", editable = true }
