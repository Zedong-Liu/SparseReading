[project]
name = "sparseread-claude"
version = "0.1.0"
description = "Claude Code bridge adapter for SparseRead"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sparseread-core>=0.1,<0.2",
    "mcp>=1.26,<2.0",
]

[project.scripts]
sparseread-claude-bridge = "sparseread_claude.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread_claude"]

[tool.uv.sources]
sparseread-core = { path = "../../../packages/sparseread-core", editable = true }
