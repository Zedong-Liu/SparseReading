[project]
name = "sparseread-core"
version = "0.1.0"
description = "Framework-neutral sparse reading protocol, readers, gate, and bridge server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6.0,<7.0"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.25.0"]
xlsx = ["openpyxl>=3.1.0,<4.0.0"]
all = ["pymupdf>=1.25.0", "openpyxl>=3.1.0,<4.0.0"]
dev = ["build>=1.2.2", "pytest>=9.0,<10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparseread"]
