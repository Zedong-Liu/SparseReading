[project]
name = "sparseread-dev"
version = "0.1.2"
description = "Development and release-test environment for SparseRead"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "mcp>=1.26,<2.0",
    "pymupdf>=1.25.0",
    "openpyxl>=3.1.0,<4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio",
]

[tool.uv]
package = false
